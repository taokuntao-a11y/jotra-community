name: Bug report / 问题反馈
description: Report a reproducible problem using fictional notes.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please hide private notes. Do not upload databases, credentials, or pairing materials. 请勿上传私人笔记、数据库、密钥或配对材料。"
  - type: input
    id: versions
    attributes:
      label: App / build / OS / language
      description: Application version, build, operating system, and interface language.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps with fictional content / 使用虚构内容复现
    validations:
      required: true
