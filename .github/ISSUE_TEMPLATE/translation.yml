name: Translation / 翻译建议
description: Improve wording or report a localization problem.
title: "[Translation] "
body:
  - type: input
    id: language
    attributes:
      label: Language and locale / 语言和地区
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Screen, page, or resource key / 页面或文案键
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Current wording → suggested wording / 原文与建议译文
      description: Explain why the wording is more natural. Preserve placeholders and release/privacy meaning.
    validations:
      required: true
