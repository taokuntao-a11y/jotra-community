name: Community checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate translation resources
        run: python3 .github/scripts/validate_translations.py
      - name: Check external adapter example
        working-directory: integrations/obsidian-selection
        run: node --test test/*.test.cjs
